<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%PRODUCT_TITLE%</title>
    <meta name="description" content="%PRODUCT_DESCRIPTION%" />
    <meta name="application-name" content="%PRODUCT_NAME%" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%PRODUCT_NAME%" />
    <link rel="canonical" href="%PRODUCT_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rubik:wght@500;600;700&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PRODUCT_NAME%" />
    <meta property="og:title" content="%PRODUCT_TITLE%" />
    <meta property="og:description" content="%PRODUCT_DESCRIPTION%" />
    <meta property="og:url" content="%PRODUCT_URL%/" />
    <meta property="og:image" content="%PRODUCT_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PRODUCT_TITLE%" />
    <meta name="twitter:description" content="%PRODUCT_DESCRIPTION%" />
    <meta name="twitter:image" content="%PRODUCT_URL%/og.png" />

    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      // Must match the storage key in src/lib/storage/storage.ts.
      ;(function () {
        try {
          var raw = localStorage.getItem('daily-worldle:v1:prefs')
          var theme = raw ? JSON.parse(raw).theme : 'system'
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>%PRODUCT_NAME% needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
